<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#174ea6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TOEIC 600">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>TOEIC 600 Challenge</title>
<style>
:root{--blue:#174ea6;--blue2:#2867c7;--bg:#f3f6fc;--card:#fff;--ink:#15233b;--muted:#64748b;--line:#dce4f0;--green:#16834a;--red:#c43e48}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:env(safe-area-inset-bottom)}
header{background:linear-gradient(135deg,#123c82,#2867c7);color:white;padding:22px 18px 20px;border-radius:0 0 22px 22px}
.wrap{max-width:720px;margin:auto;padding:0 14px}.brand{font-size:11px;letter-spacing:2px;opacity:.8}.headrow{display:flex;justify-content:space-between;align-items:center;gap:12px}.headrow h1{font-size:23px;margin:5px 0}.score{font-size:12px;background:#ffffff22;padding:7px 10px;border-radius:30px;white-space:nowrap}
main{padding-top:15px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:-2px}.stat,.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 2px 10px #1b37600a}.stat b{font-size:22px;display:block}.stat span,.small{font-size:12px;color:var(--muted)}.progress{height:8px;background:#e8edf5;border-radius:10px;overflow:hidden;margin-top:9px}.progress div{height:100%;background:var(--blue2);width:0}
nav{display:flex;gap:4px;margin:16px 0 13px;background:#e8eef8;padding:4px;border-radius:13px;position:sticky;top:0;z-index:2}
nav button{flex:1;border:0;background:transparent;padding:10px 3px;border-radius:10px;color:#52627a;font-size:12px;font-weight:700}
nav button.active{background:white;color:var(--blue);box-shadow:0 1px 5px #1a3d7018}
h2{font-size:18px;margin:0 0 12px}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.center{text-align:center}.word{font-size:clamp(32px,9vw,48px);font-weight:800;letter-spacing:-1.5px;color:var(--blue);margin:12px 0 4px}.meaning{font-size:21px;font-weight:800;color:var(--green);margin:12px 0}.btn{border:1px solid var(--line);background:white;color:var(--ink);padding:11px 13px;border-radius:11px;font-weight:700;font-size:14px;cursor:pointer}.btn.primary{background:var(--blue);border-color:var(--blue);color:white}.btn:disabled{opacity:.4}.btnrow{display:flex;gap:8px}.btnrow>*{flex:1}.pill{display:inline-block;background:#edf3ff;color:var(--blue);font-size:11px;font-weight:800;padding:5px 9px;border-radius:20px}.example{background:#f4f7fc;border-radius:12px;padding:12px;text-align:left;margin-top:12px;line-height:1.6}.choices{display:grid;gap:8px;margin-top:12px}.choice{padding:13px;border:1px solid var(--line);border-radius:11px;background:white;text-align:left;font-size:14px;color:var(--ink);cursor:pointer}.choice:disabled{opacity:1}.choice.correct{border-color:var(--green);background:#eaf7ef}.choice.wrong{border-color:var(--red);background:#fff0f0}.feedback{padding:12px;border-radius:12px;background:#f1f5fa;margin-top:12px;font-size:14px;line-height:1.5}.partgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:12px}.partgrid button{padding:10px 3px;font-size:12px}.partgrid button.active{background:var(--blue);color:white;border-color:var(--blue)}.install{background:#eaf1ff;border:1px solid #cbdaf6;border-radius:14px;padding:13px;color:#183e7a;line-height:1.55;font-size:13px}.listitem{padding:12px 0;border-bottom:1px solid var(--line)}.listitem:last-child{border:0}.muted{color:var(--muted)}.hidden{display:none!important}footer{text-align:center;color:var(--muted);font-size:11px;padding:22px 0 30px}
@media(min-width:600px){.wrap{padding:0 20px}.stats{gap:12px}nav button{font-size:14px}}
</style>
</head>
<body>
<header><div class="wrap"><div class="brand">DAILY ENGLISH TRAINING</div><div class="headrow"><div><h1>TOEIC 600 Challenge</h1><div style="font-size:12px;opacity:.85">毎日10単語 · Listening Part 1–4</div></div><div class="score">目標 600点</div></div></div></header>
<div class="wrap">
<main>
<section class="stats">
 <div class="stat"><b id="todayCount">0/10</b><span>今日の単語</span><div class="progress"><div id="todayBar"></div></div></div>
 <div class="stat"><b id="weakCount">0</b><span>苦手単語</span></div>
 <div class="stat"><b id="accuracy">—</b><span>テスト正答率</span></div>
</section>
<nav>
 <button class="active" data-tab="words">単語</button><button data-tab="listen">リスニング</button><button data-tab="review">苦手復習</button><button data-tab="record">記録</button>
</nav>
<section id="view"></section>
<div class="install" style="margin-top:16px"><b>📲 iPhoneのホーム画面に追加</b><br>このページをSafariで開き、共有ボタン →「ホーム画面に追加」→「追加」を選んでください。</div>
</main>
<footer>TOEIC 600 Challenge · 学習データはこの端末のブラウザに保存</footer>
</div>
<script>
const WORDS=[
{en:"accomplish",ipa:"əˈkɑːmplɪʃ",ja:"達成する・成し遂げる",ex:"We accomplished our sales target.",jp:"私たちは販売目標を達成した。"},
{en:"purchase",ipa:"ˈpɜːrtʃəs",ja:"購入する・購入",ex:"We purchased new equipment.",jp:"私たちは新しい設備を購入した。"},
{en:"available",ipa:"əˈveɪləbl",ja:"利用できる・入手可能な",ex:"The manager is available today.",jp:"そのマネージャーは今日対応可能です。"},
{en:"require",ipa:"rɪˈkwaɪər",ja:"必要とする・要求する",ex:"This position requires experience.",jp:"この職種には経験が必要です。"},
{en:"confirm",ipa:"kənˈfɜːrm",ja:"確認する・確定する",ex:"Please confirm your reservation.",jp:"予約を確認してください。"},
{en:"increase",ipa:"ɪnˈkriːs",ja:"増加する・増やす",ex:"Sales increased last month.",jp:"先月、売上が増加した。"},
{en:"appointment",ipa:"əˈpɔɪntmənt",ja:"予約・約束・面会",ex:"I have an appointment at 3 p.m.",jp:"午後3時に予定があります。"},
{en:"delay",ipa:"dɪˈleɪ",ja:"遅延・遅らせる",ex:"The flight was delayed.",jp:"その便は遅延した。"},
{en:"provide",ipa:"prəˈvaɪd",ja:"提供する・供給する",ex:"The company provides training.",jp:"その会社は研修を提供している。"},
{en:"improve",ipa:"ɪmˈpruːv",ja:"改善する・向上させる",ex:"We need to improve quality.",jp:"私たちは品質を改善する必要がある。"}
];
const LISTEN=[
{part:1,title:"写真描写",scene:"オフィスで男性が机の上に書類を並べている場面",script:"A man is arranging some documents on a desk.",jp:"男性が机の上に書類を並べています。",q:"What is the man doing?",opts:["He is arranging documents.","He is repairing a printer.","He is opening a window.","He is making a phone call."],a:0},
{part:2,title:"応答問題",script:"When will the new equipment arrive?",jp:"新しい設備はいつ到着しますか？",q:"最も自然な応答はどれですか？",opts:["At the main office.","By Friday afternoon.","The equipment is expensive.","It was made in Japan."],a:1},
{part:3,title:"会話問題",script:"Woman: Have you finished the sales report? Man: Almost. I just need to check the final numbers. Woman: Please send it to me before noon.",jp:"女性：営業報告書は終わりましたか？ 男性：ほぼ終わりました。最後の数字を確認するだけです。女性：正午までに送ってください。",q:"What does the man need to do?",opts:["Schedule a meeting.","Check some numbers.","Call a customer.","Print a new brochure."],a:1},
{part:4,title:"説明文問題",script:"Good morning, everyone. This is a reminder that our office will be closed this Friday for maintenance. Regular business hours will resume on Monday.",jp:"皆さん、おはようございます。今週金曜日はメンテナンスのためオフィスが休業となります。通常営業は月曜日に再開します。",q:"Why will the office be closed?",opts:["For a staff meeting.","Because of bad weather.","For maintenance.","For a public holiday."],a:2}
];
const KEY="toeic600-pwa-v1";
let data;try{data=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){data={}}
data.learned=data.learned||[];data.weak=data.weak||[];data.daily=data.daily||{};data.quiz=data.quiz||{right:0,total:0};
let tab="words",wordIndex=0,revealed=false,partIndex=0,selected=null,answered=false,showScript=false,rate=1;
const $=id=>document.getElementById(id),today=()=>new Date().toLocaleDateString("en-CA");
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}
function speak(t,speed=1){if(!("speechSynthesis"in window)){alert("この端末では音声読み上げに対応していません。");return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=speed;const v=speechSynthesis.getVoices().find(x=>x.lang==="en-US");if(v)u.voice=v;speechSynthesis.speak(u)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function stats(){const n=(data.daily[today()]||[]).length;$("todayCount").textContent=n+"/10";$("todayBar").style.width=n*10+"%";$("weakCount").textContent=data.weak.length;$("accuracy").textContent=data.quiz.total?Math.round(data.quiz.right/data.quiz.total*100)+"%":"—"}
function setTab(t){tab=t;document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===t));render()}
document.querySelectorAll("nav button").forEach(b=>b.addEventListener("click",()=>setTab(b.dataset.tab)));
function render(){stats();if(tab==="words")wordsView();if(tab==="listen")listenView();if(tab==="review")reviewView();if(tab==="record")recordView()}
function wordsView(){const w=WORDS[wordIndex],v=$("view");v.innerHTML=`<div class="row"><h2>今日の単語</h2><span class="pill">${wordIndex+1} / ${WORDS.length}</span></div><div class="card center"><span class="pill">TOEIC頻出語彙</span><div class="word">${w.en}</div><div class="small">${w.ipa}</div><div class="btnrow" style="margin-top:14px"><button class="btn" id="hear">🔊 発音を聞く</button><button class="btn" id="hearSlow">🐢 ゆっくり</button></div>${revealed?`<div class="meaning">${w.ja}</div><div class="example"><b>例文</b><br>${w.ex}<div class="muted" style="font-size:13px;margin-top:5px">${w.jp}</div><button class="btn" style="margin-top:10px;width:100%" id="hearEx">🔊 例文を聞く</button></div>`:`<button class="btn primary" style="width:100%;margin-top:16px" id="reveal">意味・例文を表示</button>`}</div><div class="btnrow" style="margin-top:10px"><button class="btn" id="prev" ${wordIndex===0?"disabled":""}>← 前へ</button><button class="btn" id="weak">${data.weak.includes(wordIndex)?"★ 苦手登録済み":"☆ 苦手に登録"}</button><button class="btn" id="next" ${wordIndex===9?"disabled":""}>次へ →</button></div><button class="btn primary" style="width:100%;margin-top:9px" id="done">${data.learned.includes(wordIndex)?"学習済み ✓":"覚えた！次の単語へ"}</button><p class="small center" style="margin-top:12px">1日10単語。音声は端末のアメリカ英語音声を利用します。</p>`;
$("hear").onclick=()=>speak(w.en,1);$("hearSlow").onclick=()=>speak(w.en,.75);if(revealed)$("hearEx").onclick=()=>speak(w.ex,1);else $("reveal").onclick=()=>{revealed=true;wordsView()};$("prev").onclick=()=>{wordIndex--;revealed=false;wordsView()};$("next").onclick=()=>{wordIndex++;revealed=false;wordsView()};$("weak").onclick=()=>{data.weak=data.weak.includes(wordIndex)?data.weak.filter(x=>x!==wordIndex):[...data.weak,wordIndex];save();wordsView();stats()};$("done").onclick=()=>{if(!data.learned.includes(wordIndex))data.learned.push(wordIndex);data.daily[today()]=data.daily[today()]||[];if(!data.daily[today()].includes(wordIndex))data.daily[today()].push(wordIndex);save();if(wordIndex<9)wordIndex++;revealed=false;render()}}
function listenView(){const q=LISTEN[partIndex],v=$("view");v.innerHTML=`<h2>リスニングトレーニング</h2><div class="small" style="margin-bottom:12px">American English · 通常 1.0x / ゆっくり 0.75x</div><div class="partgrid">${LISTEN.map((x,i)=>`<button class="btn ${i===partIndex?"active":""}" data-part="${i}">Part ${x.part}</button>`).join("")}</div><div class="card"><div class="row"><span class="pill">PART ${q.part}</span><b>${q.title}</b></div>${q.scene?`<div class="example" style="margin-top:12px">🖼️ ${q.scene}</div>`:""}<div class="center" style="padding:17px 0"><div style="font-size:35px">🎧</div><b>英文音声を聞く</b><div class="small">アメリカ英語</div></div><div class="btnrow"><button class="btn primary" id="play">▶ 通常速度 1.0x</button><button class="btn" id="slow">🐢 ゆっくり 0.75x</button></div><div class="row" style="margin-top:18px"><b>聞き取りテスト</b><button class="btn" id="script">${showScript?"英文を隠す":"英文・訳を見る"}</button></div>${showScript?`<div class="example">${esc(q.script)}<div class="muted" style="margin-top:7px">${q.jp}</div></div>`:""}<p style="font-weight:700;margin:17px 0 8px">${q.q}</p><div class="choices">${q.opts.map((o,i)=>`<button class="choice ${answered&&i===q.a?"correct":""} ${answered&&selected===i&&i!==q.a?"wrong":""}" data-choice="${i}" ${answered?"disabled":""}>${"ABCD"[i]}. ${o}</button>`).join("")}</div><div id="feedback"></div>${answered?`<button class="btn primary" style="width:100%;margin-top:12px" id="nextPart">${partIndex===3?"最初の問題へ":"次のPartへ"} →</button>`:""}</div>`;
v.querySelectorAll("[data-part]").forEach(b=>b.onclick=()=>{partIndex=+b.dataset.part;selected=null;answered=false;showScript=false;listenView()});$("play").onclick=()=>speak(q.script,1);$("slow").onclick=()=>speak(q.script,.75);$("script").onclick=()=>{showScript=!showScript;listenView()};v.querySelectorAll("[data-choice]").forEach(b=>b.onclick=()=>{if(answered)return;selected=+b.dataset.choice;answered=true;data.quiz.total++;if(selected===q.a)data.quiz.right++;save();listenView()});if(answered){$("feedback").innerHTML=`<div class="feedback"><b style="color:${selected===q.a?"#16834a":"#c43e48"}">${selected===q.a?"正解！":"不正解"}</b><br>正解：${"ABCD"[q.a]}. ${q.opts[q.a]}<div class="muted" style="margin-top:5px">${q.jp}</div></div>`;$("nextPart").onclick=()=>{partIndex=(partIndex+1)%4;selected=null;answered=false;showScript=false;listenView()}}}
function reviewView(){const v=$("view");v.innerHTML=`<h2>苦手単語の復習</h2><p class="small">苦手登録した単語を何度も聞いて覚えよう。</p>${data.weak.length?data.weak.map(i=>`<div class="listitem row"><div style="flex:1"><b>${WORDS[i].en}</b><div class="small">${WORDS[i].ja}</div><div class="small">${WORDS[i].ex}</div></div><button class="btn" data-speak="${i}">🔊</button><button class="btn" data-remove="${i}">解除</button></div>`).join(""):`<div class="card center" style="padding:30px">🎉<br><b>苦手単語はまだありません</b><p class="small">単語学習から苦手な単語を登録できます。</p></div>`}`;v.querySelectorAll("[data-speak]").forEach(b=>b.onclick=()=>speak(WORDS[+b.dataset.speak].en));v.querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>{data.weak=data.weak.filter(x=>x!==+b.dataset.remove);save();reviewView();stats()})}
function recordView(){const v=$("view"),days=Object.keys(data.daily).sort().reverse();v.innerHTML=`<h2>学習記録</h2><div class="stats"><div class="stat"><b>${data.learned.length}</b><span>累計学習単語</span></div><div class="stat"><b>${data.quiz.total?Math.round(data.quiz.right/data.quiz.total*100)+"%":"—"}</b><span>正答率</span></div><div class="stat"><b>${days.length}</b><span>学習日数</span></div></div><div class="card" style="margin-top:12px"><b>学習履歴</b>${days.length?days.slice(0,30).map(d=>`<div class="listitem"><div class="row"><span>${d}</span><b>${data.daily[d].length}/10語</b></div><div class="progress"><div style="width:${data.daily[d].length*10}%"></div></div></div>`).join(""):`<p class="small">まだ学習履歴がありません。</p>`}</div><button class="btn" style="width:100%;margin-top:12px" id="reset">学習記録をリセット</button>`;$("reset").onclick=()=>{if(confirm("すべての学習記録を削除しますか？")){data={learned:[],weak:[],daily:{},quiz:{right:0,total:0}};save();render()}}}
if("serviceWorker"in navigator&&location.protocol.startsWith("http"))window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
render();
</script>
</body></html>
